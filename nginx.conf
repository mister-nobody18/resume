# Security headers for soricu.ro — portable equivalent of public/_headers,
# for anyone deploying this behind nginx instead of Netlify/Cloudflare Pages.
# Include this block inside the relevant `server { ... }` / `location / { ... }`.

# server {
#     listen 443 ssl http2;
#     server_name soricu.ro;
#
#     root /var/www/soricu.ro/dist;
#     index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-75NVEdc4/yRBfH1ftxQzuUuFu5VboQFkIFkAACZb8Ro='; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

#     location / {
#         try_files $uri $uri/ =404;
#     }
# }

# Note: the CSP script-src hash above must be regenerated whenever the inline
# theme-init script in src/pages/index.astro changes. See README.md.
